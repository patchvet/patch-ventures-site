<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patch Ventures</title>
<meta name="description" content="Patch Ventures backs businesses across service and healthcare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EFE3CF;
  --ink: #2B2D77;
  --body: #3A3B4F;
  --rule: #D9D9D6;
  --accent: #EF3340;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #2B2D77; --ink: #FFFFFF; --body: #EFE3CF; --rule: #4A4C93; }
}
:root[data-theme="dark"] { --bg: #2B2D77; --ink: #FFFFFF; --body: #EFE3CF; --rule: #4A4C93; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--body);
  font-family: "Poppins", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-weight: 300;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  text-align: center;
}
main { max-width: 640px; width: 100%; }
h1 {
  font-weight: 700;
  font-size: clamp(32px, 6vw, 48px);
  line-height: 1.15;
  color: var(--ink);
  margin: 0 0 20px;
  letter-spacing: -0.01em;
}
.tag { font-size: clamp(16px, 2.4vw, 19px); margin: 0 auto; max-width: 30em; }
hr { border: 0; border-top: 1px solid var(--rule); width: 48px; margin: 40px auto; }
.note { font-size: 14px; margin: 0 0 6px; }
.note a, footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }
footer { margin-top: 48px; font-size: 12px; font-weight: 400; opacity: .85; }
footer p { margin: 2px 0; }
</style>
</head>
<body>
<main>
  <h1>Patch Ventures</h1>
  <p class="tag">Backing businesses across service and healthcare.</p>
  <hr>
  <p class="note">Our veterinary technology company lives at <a href="https://patchvet.com">patchvet.com</a>.</p>
</main>
<footer>
  <p>Patch Ventures Inc.</p>
  <p><a href="mailto:hello@patch-ventures.com">hello@patch-ventures.com</a></p>
</footer>
</body>
</html>
